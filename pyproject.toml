[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generate-project"
version = "2.1.0"
description = "A Python project generator using cookiecutter templates"
authors = [{ name = "Antonio Pisani", email = "antonio.pisani@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cookiecutter>=2.6.0", "python-dotenv>=1.1.0", "pyyaml>=6.0.0"]
keywords = ["python", "project-generator", "cookiecutter", "template"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
generate-project = "generate_project.main:main"

[project.urls]
"Source Code" = "https://github.com/apisani1/generate-project"
"Release Notes" = "https://github.com/apisani1/generate-project/releases"
"Documentation" = "https://generate-project.readthedocs.io/"
"Issue Tracker" = "https://github.com/apisani1/generate-project/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/generate_project"]

[tool.semantic_release]
version_variable = [
    "pyproject.toml:version",
    "docs/conf.py:release",
    "src/generate_project/__init__.py:__version__",
    "README.md:v",
    "docs/source/badges.md:v",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "packaging>=24.0",
]
test = [
    "pytest>=7.4.4",
    "pytest-cookies>=0.7.0",
    "pytest-xdist>=3.7.0",
    "toml>=0.10.2",
    "types-toml>=0.10.8",
]
lint = [
    "flake8>=7.1.0",
    "flake8-pyproject>=1.2.0",
    "pylint>=3.3.0",
    "black>=25.1.0",
    "isort>=6.0.0",
]
typing = [
    "mypy>=1.15",
    "types-pyyaml>=6.0.12.20250915",
]
docs = [
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
    "myst-parser>=4.0.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autobuild>=2021.3.14",
    "sphinx-sitemap>=2.6.0",
    "sphinx-tabs>=3.4.7",
    "roman>=4.2",
    "doc8>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["manual: tests that only run when explicitly targeted"]
addopts = "-m 'not manual'"

[tool.coverage.run]
omit = ["src/generate_project/templates/*", "src/generate_project/claude_assets/*"]

[tool.coverage.report]
omit = ["src/generate_project/templates/*", "src/generate_project/claude_assets/*"]

[tool.black]
line-length = 119
extend-exclude = '''
/(
    {{cookiecutter.project_name}}
)/
'''

[tool.flake8]
extend-ignore = [
    "W503",
    # E501: Line too long
    "E501",
    # D100: Missing docstring in public module
    "D100",
    # D101: Missing docstring in public class
    "D101",
    # D102: Missing docstring in public method
    "D102",
    # D103: Missing docstring in public function
    "D103",
    # D104: Missing docstring in public package
    "D104",
    # W605: Invalid escape sequence
    "W605",
    # E203: Whitespace before ':'
    "E203",
]
exclude = [
    "docs",
    "tests",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "{{cookiecutter.project_name}}",
    "claude_assets",
]
radon-max-cc = 15

[tool.mypy]
exclude = [
    '^tests/test.*\.py$',
    '^docs/.*\.py$',
    '{{cookiecutter.project_name}}',
    'templates/.*/hooks/',
    'claude_assets',
]
python_version = "3.10"
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = true
show_error_codes = true
warn_unused_ignores = false

[tool.pylint.MESSAGES_CONTROL]
disable = [
    "raw-checker-failed",
    "bad-inline-option",
    "locally-disabled",
    "file-ignored",
    "suppressed-message",
    "useless-suppression",
    "deprecated-pragma",
    "use-symbolic-message-instead",
    "use-implicit-booleaness-not-comparison-to-string",
    "use-implicit-booleaness-not-comparison-to-zero",
    "missing-module-docstring",
    "missing-function-docstring",
    "missing-class-docstring",
    "no-self-argument",
    "broad-exception-caught",
    "anomalous-backslash-in-string",
    "logging-fstring-interpolation",
    "raise-missing-from",
    "redefined-builtin",
    "invalid-overridden-method",
    "unspecified-encoding",
    "import-outside-toplevel",
    "global-statement",
    "global-variable-not-assigned",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "unnecessary-dunder-call",
    "duplicate-code",
    "line-too-long",
]

[tool.pylint.MASTER]
ignore = [
    "tests",
    "docs",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "{{cookiecutter.project_name}}",
    "claude_assets",
]

[tool.isort]
profile = "black"
known_third_party = [
    "numpy",
    "pandas",
    "keras",
    "tensorflow",
    "sklearn",
    "matplotlib",
    "scipy",
    "h5py",
    "seaborn",
    "numba",
    "gym",
    "PyQt6",
    "PyQt5",
    "pyqtgraph",
    "fastapi",
    "pytest",
    "uvicorn",
    "pydantic",
    "requests",
    "aiohttp",
    "databases",
    "aioredis",
    "sqlalchemy",
    "psycopg2-binary",
    "snappy",
    "asyncpg",
    "pytest_asyncio",
]
known_first_party = ["generate_project"]
force_single_line = false
multi_line_output = 3
force_grid_wrap = 2
use_parentheses = true
include_trailing_comma = true
lines_after_imports = 1
ensure_newline_before_comments = true
line_length = 119
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
default_section = "FIRSTPARTY"
extend_skip = [
    "tests",
    "docs",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
    "{{cookiecutter.project_name}}",
]

[tool.doc8]
max-line-length = 120
ignore = ["D004", "D002"]
ignore-path = ["docs/_build"]
