# This workflow was inspired by Eric Riddoch's "built-test-publish.yaml"
# but has been fully re-implemented and adapted for this project.

name: Tests

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["{{ cookiecutter.python_min_version }}"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ "{{" }} matrix.python-version {{ "}}" }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ "{{" }} matrix.python-version {{ "}}" }}

      - name: Cache Poetry dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .venv
          key: ${{ "{{" }} runner.os {{ "}}" }}-poetry-v2-${{ "{{" }} hashFiles('**/poetry.lock', '**/pyproject.toml') {{ "}}" }}
          restore-keys: |
            ${{ "{{" }} runner.os {{ "}}" }}-poetry-v2-

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          poetry --version

      - name: Configure Poetry
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: ./run.sh install:all

      - name: Check code formatting with black
        run: ./run.sh format:check:black

      - name: Check import sorting with isort
        run: ./run.sh format:check:isort

      - name: Run type checking with mypy
        run: ./run.sh lint:mypy

      - name: Run linting with flake8
        run: ./run.sh lint:flake8

      - name: Run tests
        run: ./run.sh tests || [ $? -eq 5 ]
